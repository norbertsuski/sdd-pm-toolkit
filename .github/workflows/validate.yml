name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-pm-toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash scripts/validate-structure.sh
      - run: bash scripts/validate-pm-evals.sh
      - run: python3 -m unittest discover -s tests -v
